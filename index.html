<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psych Midterm Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF0F8; --card:#FFFFFF; --ink:#1B2A5C; --muted:#5B6488; --line:#C9CFE6;
  --hl:#FFE24A; --hl-ink:#3B3200; --ok:#178A5E; --ok-bg:#DDF5EA; --bad:#D6343A; --bad-bg:#FBE3E4;
  --graphite:#2E3350;
  --f-head:"Prompt","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1330; --card:#171E44; --ink:#EAEDFF; --muted:#9AA3D1; --line:#2B3466;
    --hl:#FFD93B; --hl-ink:#2B2400; --ok:#3DD598; --ok-bg:#0F3A2E; --bad:#FF6B6F; --bad-bg:#43191F;
    --graphite:#C9D0FF;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1330; --card:#171E44; --ink:#EAEDFF; --muted:#9AA3D1; --line:#2B3466;
  --hl:#FFD93B; --hl-ink:#2B2400; --ok:#3DD598; --ok-bg:#0F3A2E; --bad:#FF6B6F; --bad-bg:#43191F;
  --graphite:#C9D0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;min-height:100%;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-attachment:local}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--f-head);font-weight:700;font-size:22px}
.iconbtn{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-size:15px}
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.lvl{display:flex;align-items:center;gap:12px}
.lvl b{font-family:var(--f-head);font-size:28px}
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--hl);border-right:2px solid var(--ink)}
.small{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;font-size:15px;position:relative}
.chip[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);font-weight:700}
.chip .m{font-size:12px;opacity:.75;margin-left:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.mode:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mode h3{font-size:18px;margin-bottom:2px}
.mode p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5}
.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;font-family:var(--f-head);font-weight:600}
.hearts{letter-spacing:2px}
.prog{height:8px;border:2px solid var(--ink);border-radius:6px;background:var(--card);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ink)}
.tag{display:inline-block;font-size:13px;background:var(--hl);color:var(--hl-ink);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:600;margin-bottom:8px}
.q{font-size:19px;font-weight:600;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%}
.opt .b{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:14px;font-weight:600}
.opt:not([disabled]):hover{background:var(--hl);color:var(--hl-ink)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt.no .b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card)}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--bad)}
.fb strong{font-family:var(--f-head)}
.btn{display:inline-block;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:10px 18px;font-family:var(--f-head);font-weight:600;margin-top:12px}
.btn.alt{background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.score{font-family:var(--f-head);font-size:56px;font-weight:700;line-height:1}
.wrongitem{border-top:2px dashed var(--line);padding:10px 0}
.wrongitem:first-child{border-top:0}
.card3d{perspective:1000px;margin-bottom:12px}
.flash{min-height:250px;border:2px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--ink);padding:20px;display:flex;flex-direction:column;justify-content:center;width:100%;text-align:left}
.flash.back{background:var(--hl);color:var(--hl-ink)}
.flash .lab{font-size:13px;opacity:.7;margin-bottom:6px}
.flash .ans{font-family:var(--f-head);font-weight:600;font-size:20px;margin-bottom:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px;text-align:left;min-height:48px;line-height:1.35}
.tile.sel{background:var(--hl);color:var(--hl-ink)}
.tile.done{background:var(--ok-bg);border-color:var(--ok);opacity:.55}
.tile.shake{background:var(--bad-bg);border-color:var(--bad)}
.tile[disabled]{cursor:default}
.combo{color:var(--bad);font-weight:700}
.timer{font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.mode{transition:none}}
@media (max-width:420px){.modes{grid-template-columns:1fr}.q{font-size:18px}}
.boss{position:relative;text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px 10px;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px}
.bemoji{font-size:64px;line-height:1.1;display:inline-block}
.bname{font-family:var(--f-head);font-weight:600;margin-bottom:6px}
.hp{height:16px;border:2px solid var(--ink);border-radius:9px;background:var(--paper);overflow:hidden}
.hp i{display:block;height:100%;background:var(--bad);transition:width .5s}
.bemoji.hit{animation:hit .5s}
.bemoji.atk{animation:atk .5s}
@keyframes hit{0%{transform:none}20%{transform:translateX(-12px) rotate(-8deg);filter:brightness(2)}40%{transform:translateX(12px) rotate(8deg)}100%{transform:none}}
@keyframes atk{0%{transform:scale(1)}40%{transform:scale(1.4) translateY(8px)}100%{transform:scale(1)}}
.dmg{position:absolute;top:18px;left:50%;font-family:var(--f-head);font-weight:700;font-size:28px;color:var(--bad);animation:dmg 1s forwards;pointer-events:none;-webkit-text-stroke:1px var(--ink)}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-50px);opacity:0}}
.sheet.shake,.tile.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.opt.ok{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.03)}}
.opt.dim{opacity:.3;text-decoration:line-through}
.pus{display:flex;gap:8px;margin-bottom:12px}
.pu{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:2px 10px;font-size:14px;font-family:var(--f-head)}
.pu[disabled]{opacity:.4;cursor:default}
.say{font-weight:600;margin-bottom:4px}
.cf{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:70;pointer-events:none}
.tst{background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 16px;font-family:var(--f-head);font-weight:600;animation:tin .25s;box-shadow:3px 3px 0 var(--hl)}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
.bdg{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;background:var(--hl);color:var(--hl-ink);margin:0 6px 6px 0}
.bdg.lock{background:var(--card);color:var(--muted);border-style:dashed}
.hero{display:flex;align-items:center;gap:12px}
.mascot{font-size:52px;line-height:1}
.won{animation:bounce .8s infinite alternate}
@keyframes bounce{to{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="fx" aria-hidden="true"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- DATA ---------- */
var MODS = {
  intro:"จิตวิทยาเบื้องต้น", comm:"การสื่อสาร", mot:"แรงจูงใจ/อารมณ์", stress:"เครียด/Burnout",
  learn:"การเรียนรู้", mem:"ความจำ", pos:"Positive Psych", cog:"Cognition/Piaget", iq:"Intelligence & RAS"
};
/* [module, question, correct, [3 wrong], explanation, scenarioFlag] */
var Q = [
/* INTRO */
["intro","ใครก่อตั้งห้องทดลองจิตวิทยาเชิงทดลองแห่งแรกของโลก (ปี 1879 ที่ Leipzig)?","Wilhelm Wundt",["William James","Sigmund Freud","John B. Watson"],"1879 + Leipzig + Wundt = จุดกำเนิดจิตวิทยาวิทยาศาสตร์"],
["intro","Structuralism (Wundt/Titchener) ศึกษาอะไร และใช้วิธีใด?","Structure ของ Consciousness ด้วย Introspection",["Unconscious ด้วยการวิเคราะห์ความฝัน","Observable behavior ด้วยการทดลอง","Adaptation ด้วยการสังเกตสัตว์"],"Structuralism = Wundt/Titchener + Introspection"],
["intro","กลุ่มใดเน้นว่ากระบวนการทางจิตช่วยให้มนุษย์ปรับตัว (Adaptation) เพื่อการอยู่รอด?","Functionalism (William James)",["Structuralism","Psychoanalysis","Humanism"],"Functionalism = William James + Adaptation"],
["intro","Freud (Psychoanalysis) เน้นสิ่งใดเป็นหลัก?","Unconscious mind และประสบการณ์วัยเด็ก",["Free will และ Self-actualization","เฉพาะพฤติกรรมที่สังเกตได้","หน้าที่ของจิตเพื่อการปรับตัว"],"Psychoanalysis = Freud + Unconscious"],
["intro","Behaviorism (Watson & Skinner) ศึกษาอะไร?","Observable behavior จากการเรียนรู้และสิ่งแวดล้อม",["Consciousness ผ่าน Introspection","Free will","Unconscious drives"],"Behaviorism = Observable"],
["intro","Humanism (Maslow & Rogers) ถูกเรียกว่าอะไร และเน้นอะไร?","3rd Force — Free will และศักยภาพมนุษย์",["1st Force — โครงสร้างของจิต","2nd Force — พฤติกรรมที่สังเกตได้","3rd Force — แรงขับทางเพศ"],"Humanism = Maslow/Rogers + Free Will + Self-actualization"],
["intro","รากศัพท์กรีกของ Psychology คือ?","Psyche (จิต/วิญญาณ) + Logos (การศึกษา)",["Physis + Logos","Psyche + Techne","Mens + Scientia"],"Psyche = Mind/Soul, Logos = Study"],
["intro","Mind กับ Behavior ต่างกันอย่างไร?","Mind = ประสบการณ์ภายใน (Subjective); Behavior = การกระทำที่ Observable",["Mind = สังเกตได้; Behavior = ภายใน","เป็นสิ่งเดียวกัน","Mind = การกระทำ; Behavior = ความคิด"],"Subjective vs Observable"],
/* COMM */
["comm","โมเดล S-M-C-R ของ David Berlo (1960) ย่อมาจาก?","Sender, Message, Channel, Receiver",["Source, Meaning, Code, Response","Speaker, Media, Context, Reply","Sender, Medium, Content, Reaction"],"4 องค์ประกอบพื้นฐานของการสื่อสาร"],
["comm","ใครทำหน้าที่ Encoding และใครทำหน้าที่ Decoding?","Sender เข้ารหัส / Receiver ถอดรหัส",["Sender ถอดรหัส / Receiver เข้ารหัส","Channel เข้ารหัส / Message ถอดรหัส","ทั้งสองทำ Encoding เหมือนกัน"],"Sender encodes / Receiver decodes"],
["comm","กฎ Mehrabian 55/38/7 — ตัวเลข 55% คืออะไร?","Non-verbal (ภาษากาย)",["Paralanguage (น้ำเสียง)","Verbal (คำพูด)","Proxemics (ระยะห่าง)"],"55 = Body language, 38 = Tone, 7 = Words"],
["comm","Proxemics คือ non-verbal cue เกี่ยวกับอะไร?","ระยะห่างระหว่างบุคคล (Personal space)",["การสบตา","การสัมผัส","น้ำเสียงและจังหวะพูด"],"Proxemics = Proximity = ระยะห่าง"],
["comm","Oculesics และ Haptics คือ?","การสบตา และ การสัมผัส",["การสัมผัส และ การสบตา","ท่าทาง และ น้ำเสียง","ระยะห่าง และ สีหน้า"],"Ocul = eye, Haptic = touch"],
["comm","Kinesics และ Paralanguage คือ?","ภาษากาย/สีหน้า/ท่าทาง และ น้ำเสียง/ระดับเสียง",["ระยะห่าง และ การสัมผัส","น้ำเสียง และ สีหน้า","การสบตา และ ระยะห่าง"],"Big 5: Kinesics, Paralanguage, Proxemics, Oculesics, Haptics"],
["comm","Thomas-Kilmann Conflict Model (TKI) ประเมินจาก 2 มิติใด?","Assertiveness vs Cooperativeness",["Emotion vs Logic","Speed vs Accuracy","Trust vs Power"],"Assertive = เป้าหมายตนเอง, Cooperative = เป้าหมายผู้อื่น"],
["comm","โหมดจัดการความขัดแย้งแบบ Win-Win คือ?","Collaborating",["Competing","Compromising","Accommodating"],"Competing = Win-Lose, Avoiding = Lose-Lose"],
["comm","SBI Feedback Model ย่อมาจาก?","Situation, Behavior, Impact",["Speak, Believe, Improve","Situation, Belief, Intention","Sender, Behavior, Interpretation"],"บอกบริบท + พฤติกรรมที่เห็นจริง (ไม่ตัดสิน) + ผลกระทบ"],
["comm","ประโยคใดเป็น 'I' Message ที่ถูกต้อง?","ฉันรู้สึกกังวลเมื่องานส่งช้า เพราะฉันต้องแก้แผนใหม่",["เธอนี่ไม่เคยรับผิดชอบเลย","ทุกคนก็รู้ว่าเธอทำงานช้า","ทำไมเธอถึงชอบทำให้คนอื่นเดือดร้อน"],"I Message = พูดความรู้สึกของตนเอง ไม่กล่าวโทษ",1],
["comm","เพื่อนขอให้ช่วยงาน คุณไม่อยากทำแต่ยอมทำตามทั้งหมดเพื่อรักษาน้ำใจ นี่คือโหมดใด?","Accommodating (Yielding)",["Compromising","Avoiding","Collaborating"],"Accommodating = ยอมตามผู้อื่น",1],
["comm","สองฝ่ายต่างยอมลดข้อเรียกร้องคนละครึ่งเพื่อจบปัญหา คือโหมดใด?","Compromising (Middle ground)",["Competing","Collaborating","Avoiding"],"Compromising = หาจุดกึ่งกลาง",1],
["comm","'ในประชุมเมื่อวาน (S) คุณพูดแทรก 3 ครั้ง (B) ทำให้ทีมไม่กล้าเสนอความเห็น (I)' เป็นการให้ feedback แบบใด?","SBI Model",["Mehrabian's Rule","Transactional Appraisal","Two-Factor Theory"],"S + B + I ครบ",1],
/* MOT */
["mot","Motivation คือ?","กระบวนการที่เปิด ผลักดัน กำหนดทิศทาง และรักษาพฤติกรรมมุ่งสู่เป้าหมาย",["การตอบสนองต่อสิ่งเร้าตามสัญชาตญาณ","การเปลี่ยนแปลงพฤติกรรมอย่างถาวรจากประสบการณ์","การตื่นตัวทางสรีระเท่านั้น"],"Initiates + Guides + Maintains goal-directed behavior"],
["mot","ลำดับขั้นความต้องการของ Maslow จากล่างขึ้นบนคือ?","Physiological → Safety → Belongingness/Love → Esteem → Self-Actualization",["Safety → Physiological → Esteem → Belongingness → Self-Actualization","Physiological → Belongingness → Safety → Esteem → Self-Actualization","Physiological → Safety → Esteem → Belongingness → Self-Actualization"],"ปัจจัย 4 ก่อน แล้วปลอดภัย รัก เคารพ และสุดท้ายศักยภาพสูงสุด"],
["mot","Drive-Reduction Theory (Clark Hull) — พฤติกรรมเกิดเพื่ออะไร?","ลดแรงขับ (Drive) เพื่อรักษา Homeostasis",["เพิ่ม Arousal ให้สูงที่สุด","ได้รับ Incentive ภายนอก","แสดง Free will"],"Need → Drive → Behavior → Homeostasis"],
["mot","Homeostasis คือ?","แนวโน้มของร่างกายในการรักษาสมดุลภายใน",["การแสวงหาความตื่นเต้น","การเรียนรู้จากรางวัล","การตีความอารมณ์"],"ดุลยภาพทางร่างกาย"],
["mot","Incentive Theory อธิบายว่าพฤติกรรมถูกกระตุ้นด้วย?","สิ่งจูงใจภายนอก (Pull factor / Reward)",["แรงขับภายในจากความขาดแคลน","ความคิดอัตโนมัติเชิงลบ","การเลียนแบบตัวแบบ"],"Drive = Push, Incentive = Pull"],
["mot","ตามทฤษฎีใดที่ว่า 'การตื่นตัวทางร่างกายเกิดก่อน แล้วจึงรู้สึกอารมณ์'?","James-Lange Theory",["Cannon-Bard Theory","Schachter-Singer Theory","Facial Feedback"],"We feel afraid because our heart runs fast"],

  '<button class="mode wide" onclick="startQuiz(\'boss\')"><div class="row" style="align-items:center;flex-wrap:nowrap"><span style="font-size:48px;line-height:1">'+b[0]+'</span><div><h3>⚔️ ท้าสู้บอส: '+b[1]+(S.bosses[scope]?' ✅':'')+'</h3><p>10 ข้อ · หัวใจ 3 ดวง · ตอบถูกติดกันเพื่อโจมตีคริติคอล · มีไอเทม 50:50 และข้าม</p></div></div></button>'+
  '<button class="mode" onclick="startQuiz(\'speed\')"><h3>⏱️ Speed 60s</h3><p>ตอบถูกครบ 5 ข้อติด ได้เวลาเพิ่ม +3 วิ สถิติ: '+S.best+' ข้อ</p></button>'+
  '<button class="mode" onclick="startMatch()"><h3>🧩 Match</h3><p>จับคู่ศัพท์กับคีย์เวิร์ด ลุ้น 3 ดาว</p></button>'+
  '<button class="mode" onclick="startFlash()"><h3>🃏 Flashcards</h3><p>พลิกการ์ดทวนคำตอบพร้อมคำอธิบาย</p></button>'+
  '<button class="mode" onclick="startQuiz(\'miss\')" '+(mc?'':'disabled')+'><h3>📓 สมุดข้อพลาด ('+mc+')</h3><p>ตอบถูกอีกครั้งเพื่อลบออก</p></button>'+
  '</div>'+
  '<div class="sheet" style="margin-top:16px"><h2 style="font-size:18px;margin-bottom:10px">เหรียญตรา</h2>'+bs+'</div>'+
  '<p class="small">ใช้ปุ่ม 1–4 บนคีย์บอร์ดเพื่อตอบเร็วขึ้น · ความคืบหน้าเซฟในเบราว์เซอร์นี้</p>'
  );
}
function setScope(s){ scope = s; home(); }
function toggleTheme(){
  var r = document.documentElement, cur = r.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : (window.matchMedia && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", dark ? "light" : "dark");
}

/* ---------- QUIZ / BOSS / SPEED ---------- */
function startQuiz(mode){
  stopTimer();
  var list;
  if(mode==="miss") list = shuffle(S.miss.filter(function(i){ return Q[i]; }));
  else list = shuffle(poolFor(scope));
  if(mode==="boss") list = list.slice(0,10);
  if(!list.length){ home(); return; }
  G = {id:Math.random(), mode:mode, list:list, i:0, score:0, lives:3, streak:0, bestStreak:0, xp:0, wrong:[], locked:false, time:60, hp:90, hpMax:90, pu:{fifty:1, skip:1}};
  if(mode==="speed"){
    timerId = setInterval(function(){
      if(!G) return;
      G.time--;
      var t = $("#tm"); if(t){ t.textContent = G.time+"s"; t.className = "timer"+(G.time<=10?" low":""); }
      if(G.time<=0){ finish(); }
    },1000);
  }
  renderQ();
}
function hudLeft(){
  if(G.mode==="boss") return '<span class="hearts" aria-label="หัวใจ">'+"❤️".repeat(Math.max(G.lives,0))+"🖤".repeat(3-Math.max(G.lives,0))+'</span>';
  if(G.mode==="speed") return '<span id="tm" class="timer'+(G.time<=10?' low':'')+'">'+G.time+'s</span>';
  return '<span>สมุดข้อพลาด</span>';
}
function comboHTML(){ return G.streak>=2 ? '<span class="combo">🔥 คอมโบ x'+G.streak+'</span>' : '<span class="small">ตอบถูก '+G.score+'</span>'; }
function renderQ(){
  if(G.i>=G.list.length){ finish(); return; }
  var qi = G.list[G.i], q = Q[qi];
  var opts = shuffle([{t:q[2],ok:true}].concat(q[3].map(function(w){ return {t:w,ok:false}; })));
  G.opts = opts; G.locked = false;
  var h = '<div class="top"><button class="iconbtn" onclick="quit()">← ออก</button><span class="small" id="xpv">+'+G.xp+' XP</span><button class="iconbtn" id="mb" onclick="toggleMute()">'+(S.mute?"🔇":"🔊")+'</button></div>';
  if(G.mode==="boss"){
    var b = BOSS[scope]||BOSS.all;
    h += '<div class="boss"><div class="bemoji" id="be">'+b[0]+'</div><div class="bname">'+b[1]+'</div><div class="hp"><i id="hpb" style="width:'+(Math.max(G.hp,0)/G.hpMax*100)+'%"></i></div><div class="small" id="hpt">HP '+Math.max(G.hp,0)+' / '+G.hpMax+'</div></div>';
  }
  h += '<div class="hud"><span id="hud1">'+hudLeft()+'</span><span id="cmb">'+comboHTML()+'</span></div>';
  if(G.mode==="boss"){
    h += '<div class="pus"><button class="pu" id="pu1" onclick="useFifty()" '+(G.pu.fifty?'':'disabled')+'>✂️ 50:50 ×'+G.pu.fifty+'</button><button class="pu" id="pu2" onclick="useSkip()" '+(G.pu.skip?'':'disabled')+'>⏭️ ข้าม ×'+G.pu.skip+'</button></div>';
  }
  if(G.mode!=="speed") h += '<div class="prog"><i style="width:'+(G.i/G.list.length*100)+'%"></i></div>';
  h += '<div class="sheet" id="qs"><span class="tag">'+MODS[q[0]]+(q[5]?' · สถานการณ์':'')+'</span><p class="q">'+q[1]+'</p><div class="opts">';
  opts.forEach(function(o,k){
    h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><span class="b">'+THAI[k]+'</span><span>'+o.t+'</span></button>';
  });
  h += '</div><div id="fb"></div></div>';
  app(h);
}
function useFifty(){
  if(!G || G.locked || !G.pu.fifty) return;
  G.pu.fifty--; var n = 0;
  document.querySelectorAll(".opt").forEach(function(b,i){
    if(!G.opts[i].ok && n<2){ b.disabled = true; b.classList.add("dim"); n++; }
  });
  var p = $("#pu1"); p.disabled = true; p.textContent = "✂️ 50:50 ×0"; sfx.hit();
}
function useSkip(){
  if(!G || G.locked || !G.pu.skip) return;
  G.pu.skip--; G.locked = true; G.i++; sfx.hit(); renderQ();
}
function pick(k){
  if(!G || G.locked) return;
  if(G.opts[k] && document.querySelectorAll(".opt")[k].disabled) return;
  G.locked = true;
  var qi = G.list[G.i], q = Q[qi], ok = G.opts[k].ok, say, gain = 0, dmg = 0, crit = false;
  document.querySelectorAll(".opt").forEach(function(b,i){
    b.disabled = true;
    if(G.opts[i].ok){ b.classList.add("ok"); b.querySelector(".b").textContent="✓"; }
    else if(i===k){ b.classList.add("no"); b.querySelector(".b").textContent="✕"; }
  });
  var be = $("#be");
  if(ok){
    G.score++; G.streak++; if(G.streak>G.bestStreak) G.bestStreak=G.streak;
    gain = 10 + Math.min(G.streak,5)*2; G.xp += gain; addXP(gain);
    S.seen[qi] = (S.seen[qi]||0)+1;
    var mi = S.miss.indexOf(qi);
    if(mi>-1){ S.miss.splice(mi,1); if(!S.miss.length && G.mode==="miss") award("book"); }
    save(); sfx.ok(G.streak); buzz(20);
    award("first"); if(G.streak>=5) award("combo5"); if(G.streak>=10) award("combo10"); if(Object.keys(S.seen).length>=50) award("fifty");
    say = G.streak===3 ? "คอมโบ x3! เริ่มร้อนแล้ว 🔥" : G.streak===5 ? "x5!! ไฟลุกท่วมห้องสอบ 🌋" : G.streak===10 ? "x10!!! ตำนานแล้วครับท่าน 👑" : rnd(OKS);
    if(G.mode==="boss"){
      crit = G.streak>=3; dmg = 10 + (G.streak>=3?5:0) + (G.streak>=5?5:0); G.hp -= dmg;
      if(be){ be.classList.remove("hit","atk"); void be.offsetWidth; be.classList.add("hit"); if(G.hp<=0) be.textContent="💫"; }
      var d = document.createElement("span"); d.className="dmg"; d.textContent=(crit?"CRIT ":"")+"-"+dmg;
      $(".boss").appendChild(d); setTimeout(function(){ d.remove(); },1000);
      $("#hpb").style.width = (Math.max(G.hp,0)/G.hpMax*100)+"%"; $("#hpt").textContent = "HP "+Math.max(G.hp,0)+" / "+G.hpMax;
    }
    if(G.mode==="speed" && G.streak%5===0){ G.time += 3; say += " (+3 วิ ⏱️)"; }
  } else {
    G.streak = 0; G.lives--; G.wrong.push(qi);
    if(S.miss.indexOf(qi)<0) S.miss.push(qi);
    save(); sfx.bad(); buzz([60,40,60]); say = rnd(BADS);
    var qs = $("#qs"); if(qs){ qs.classList.add("shake"); }
    if(be){ be.classList.remove("hit","atk"); void be.offsetWidth; be.classList.add("atk"); }
  }
  $("#hud1").innerHTML = hudLeft(); $("#cmb").innerHTML = comboHTML(); $("#xpv").textContent = "+"+G.xp+" XP";
  var over = (G.mode==="boss" && (G.lives<=0 || G.hp<=0)) || G.i+1>=G.list.length;
  var fb = '<div class="fb '+(ok?'ok':'no')+'"><div class="say">🧠 '+say+'</div><strong>'+(ok?'ถูกต้อง +'+gain+' XP':'ยังไม่ถูก')+'</strong><br>'+
    (ok?'':'คำตอบ: <b>'+q[2]+'</b><br>')+'<span class="small">💡 '+q[4]+'</span></div>';
  if(G.mode==="speed"){
    $("#fb").innerHTML = fb;
    var id = G.id;
    setTimeout(function(){ if(!G || G.id!==id) return; G.i++; renderQ(); }, ok?900:2200);
  } else {
    $("#fb").innerHTML = fb+'<button class="btn" onclick="next()">'+(over?'ดูผลลัพธ์':'ข้อต่อไป')+'</button>';
    var nb = $("#fb .btn"); if(nb) nb.focus();
  }
}
function next(){
  if(!G) return;
  if(G.mode==="boss" && (G.lives<=0 || G.hp<=0)){ finish(); return; }
  G.i++; renderQ();
}
function quit(){ stopTimer(); home(); }
function finish(){
  stopTimer();
  var g = G, mode = g.mode, b = BOSS[scope]||BOSS.all;
  var total = mode==="speed" ? Math.min(g.i+ (g.locked?1:0), g.list.length) : Math.min(g.i+1, g.list.length);
  var win = (mode==="boss" && g.hp<=0), bonus = 0, big, head, sub;
  if(mode==="boss"){
    if(win){
      bonus = 30; if(g.lives===3){ bonus += 20; award("perfect"); }
      S.bosses[scope] = 1; save(); award("boss"); if(Object.keys(S.bosses).length>=3) award("boss3");
      g.xp += bonus; addXP(bonus); sfx.win(); confetti(70);
      big = '<div class="won" style="font-size:72px">🏆</div>'; head = "ปราบ "+b[1]+" สำเร็จ!"; sub = "โบนัสชนะบอส +"+bonus+" XP"+(g.lives===3?" (รวมเพอร์เฟกต์ ไม่เสียหัวใจเลย)":"");
    } else {
      big = '<div style="font-size:72px">'+b[0]+'😈</div>';
      head = g.lives<=0 ? "หัวใจหมด — บอสชนะรอบนี้" : "บอสรอดไปได้ เหลือ HP "+Math.max(g.hp,0);
      sub = "ทวนข้อที่พลาดด้านล่าง แล้วท้าอีกรอบ (ตอบถูกติดกันเพื่อโจมตีคริติคอล)"; sfx.bad();
    }
  } else if(mode==="speed"){
    if(g.score>=10) award("speed10");
    var rec = g.score>S.best; if(rec){ S.best = g.score; save(); confetti(40); sfx.win(); }
    big = '<div style="font-size:72px">⏱️</div>'; head = rec ? "สถิติใหม่! "+g.score+" ข้อ" : "หมดเวลา!"; sub = "สถิติสูงสุด: "+S.best+" ข้อ";
  } else {
    big = '<div style="font-size:72px">📓</div>'; head = "จบสมุดข้อพลาด"; sub = S.miss.length ? "ยังเหลือ "+S.miss.length+" ข้อในสมุด" : "สมุดว่างแล้ว เก่งมาก!";
  }
  var h = '<div class="top"><div class="brand">ผลลัพธ์</div></div><div class="sheet" style="text-align:center">'+big+'<h2 style="margin:6px 0">'+head+'</h2><div class="score">'+g.score+'<span class="small" style="font-size:22px"> / '+total+'</span></div>'+
    '<p class="small" style="margin:8px 0 0">'+sub+'</p><p class="small" style="margin:4px 0 0">ได้ +'+g.xp+' XP · คอมโบสูงสุด x'+g.bestStreak+'</p></div>';
  if(g.wrong.length){
    h += '<div class="sheet"><h2 style="font-size:18px;margin-bottom:6px">ข้อที่ควรทวน ('+g.wrong.length+')</h2>';
    g.wrong.forEach(function(qi){
      var q = Q[qi];
      h += '<div class="wrongitem"><div class="small">'+MODS[q[0]]+'</div><div>'+q[1]+'</div><div style="color:var(--ok);font-weight:600">✓ '+q[2]+'</div><div class="small">💡 '+q[4]+'</div></div>';
    });
    h += '</div>';
  }
  h += '<div class="row"><button class="btn" onclick="startQuiz(\''+mode+'\')">'+(mode==="boss"&&!win?'ท้าบอสอีกครั้ง':'เล่นอีกรอบ')+'</button><button class="btn alt" onclick="home()">กลับหน้าแรก</button></div>';
  G = null;
  app(h);
}

/* ---------- FLASHCARDS ---------- */
function startFlash(){
  stopTimer();
  var list = shuffle(poolFor(scope));
  if(!list.length){ home(); return; }
  F = {list:list, i:0, flipped:false, known:0, total:list.length};
  renderFlash();
}
function renderFlash(){
  if(F.i>=F.list.length){ flashDone(); return; }
  var q = Q[F.list[F.i]], body;
  if(!F.flipped){
    body = '<button class="flash" onclick="flip()"><div class="lab">'+MODS[q[0]]+' · แตะเพื่อดูคำตอบ</div><div class="ans">'+q[1]+'</div></button>';
  } else {
    body = '<button class="flash back" onclick="flip()"><div class="lab">คำตอบ</div><div class="ans">'+q[2]+'</div><div>💡 '+q[4]+'</div></button>';
  }
  var acts = F.flipped ? '<div class="row"><button class="btn alt" onclick="flashRate(false)">ยังไม่แน่ใจ (วนมาใหม่)</button><button class="btn" onclick="flashRate(true)">จำได้แล้ว ✓</button></div>' : '<p class="small">คิดคำตอบในใจก่อนแล้วค่อยพลิก — การดึงคำตอบเองช่วยจำได้ดีกว่าการอ่านซ้ำ</p>';
  app('<div class="top"><button class="iconbtn" onclick="home()">← ออก</button><span class="small">เหลือ '+(F.list.length-F.i)+' ใบ · จำได้ '+F.known+'/'+F.total+'</span></div><div class="card3d">'+body+'</div>'+acts);
}
function flip(){ F.flipped = !F.flipped; sfx.hit(); renderFlash(); }
function flashRate(k){
  var qi = F.list[F.i];
  if(k){ F.known++; addXP(3); sfx.ok(1); } else { F.list.push(qi); }
  F.i++; F.flipped = false; renderFlash();
}
function flashDone(){
  sfx.win(); confetti(30);
  app('<div class="top"><div class="brand">จบสำรับ</div></div><div class="sheet" style="text-align:center"><div style="font-size:64px">🃏</div><div class="score">'+F.known+'<span class="small" style="font-size:22px"> / '+F.total+'</span></div><p>จำได้ครบทุกใบ +'+(F.known*3)+' XP</p></div><div class="row"><button class="btn" onclick="startFlash()">สับไพ่เล่นใหม่</button><button class="btn alt" onclick="home()">กลับหน้าแรก</button></div>');
}

/* ---------- MATCH ---------- */
function startMatch(){
  stopTimer();
  var p = shuffle(PAIRS).slice(0,6);
  M = {pairs:p, L:shuffle(p.map(function(x,i){ return {id:i,t:x[0]}; })), R:shuffle(p.map(function(x,i){ return {id:i,t:x[1]}; })), sl:null, sr:null, done:{}, err:0, n:0, round:(M?M.round:0)+1, bad:null};
  renderMatch();
}
function renderMatch(){
  var h = '<div class="top"><button class="iconbtn" onclick="home()">← ออก</button><span class="small">รอบที่ '+M.round+' · จับแล้ว '+M.n+'/6 · ผิด '+M.err+'</span></div>'+
    '<div class="sheet"><h2 style="font-size:18px;margin-bottom:4px">จับคู่ศัพท์กับคีย์เวิร์ด</h2><p class="small" style="margin:0 0 12px">แตะศัพท์ทางซ้าย แล้วแตะคีย์เวิร์ดที่ตรงกันทางขวา ผิด ≤ 1 ครั้งได้ 3 ดาว</p><div class="match"><div style="display:grid;gap:10px">';
  M.L.forEach(function(x){
    var c = M.done[x.id] ? "tile done" : (M.sl===x.id ? "tile sel" : "tile");
    if(M.bad && M.bad.l===x.id) c += " shake";
    h += '<button class="'+c+'" '+(M.done[x.id]?'disabled':'')+' onclick="mPick(\'L\','+x.id+')"><b>'+x.t+'</b></button>';
  });
  h += '</div><div style="display:grid;gap:10px">';
  M.R.forEach(function(x){
    var c = M.done[x.id] ? "tile done" : (M.sr===x.id ? "tile sel" : "tile");
    if(M.bad && M.bad.r===x.id) c += " shake";
    h += '<button class="'+c+'" '+(M.done[x.id]?'disabled':'')+' onclick="mPick(\'R\','+x.id+')">'+x.t+'</button>';
  });
  h += '</div></div></div>';
  app(h);
}
function mPick(side,id){
  M.bad = null;
  if(side==="L") M.sl = (M.sl===id? null : id); else M.sr = (M.sr===id? null : id);
  if(M.sl!==null && M.sr!==null){
    if(M.sl===M.sr){ M.done[M.sl]=true; M.n++; M.sl=M.sr=null; sfx.ok(M.n); buzz(15); }
    else { M.err++; M.bad={l:M.sl,r:M.sr}; M.sl=M.sr=null; sfx.bad(); buzz([50,30,50]); }
    if(M.n>=M.pairs.length){ matchDone(); return; }
    renderMatch();
    if(M.bad){ setTimeout(function(){ if(M){ M.bad=null; renderMatch(); } },700); }
    return;
  }
  sfx.hit(); renderMatch();
}
function matchDone(){
  var stars = M.err<=1 ? 3 : (M.err<=3 ? 2 : 1);
  var gain = Math.max(10, 40 - M.err*4); addXP(gain); sfx.win();
  if(stars===3) confetti(50);
  if(M.err===0) award("match0");
  app('<div class="top"><div class="brand">จับคู่ครบ!</div></div><div class="sheet" style="text-align:center"><div class="won" style="font-size:52px">'+"⭐".repeat(stars)+"☆".repeat(3-stars)+'</div><p style="margin:8px 0 0"><b>ผิด '+M.err+' ครั้ง · +'+gain+' XP</b></p></div><div class="sheet">'+
    M.pairs.map(function(p){ return '<div class="wrongitem"><b>'+p[0]+'</b><br><span class="small">'+p[1]+'</span></div>'; }).join('')+
    '</div><div class="row"><button class="btn" onclick="startMatch()">รอบต่อไป</button><button class="btn alt" onclick="home()">กลับหน้าแรก</button></div>');
}

/* keyboard: 1-4 answer */
document.addEventListener("keydown", function(e){
  if(!G) return;
  var k = parseInt(e.key,10);
  if(k>=1 && k<=4) pick(k-1);
});
home();
</script>
</body>
